<!DOCTYPE html>

<style>

body {
  margin: 0;
  padding: 0;
}

.grid-container {
  display: grid;
  grid-template-columns: 1fr 1fr; 
  width: 100%;        
  margin: 0; 
}

.box {
  height: 150px;                  
  display: flex;                 
  justify-content: left;        
  align-items: center;            
  color: rgb(13, 11, 11);                
  font-size: 20px;                
}

.box1 {
  background-color: #749561;      
}

.box2 {
  background-color: #e19e9e;     
}
</style>

<div class="grid-container">
  <div class="box box1">a text of your choice</div>
  <div class="box box2">a text of your choice</div>
</div>
