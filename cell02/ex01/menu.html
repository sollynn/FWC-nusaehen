<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNCF - Le Menu Sandwich "Drop-down"</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>


  <div class="dropdown-wrapper">
    

    <div class="dropdown-container">
  <select class="custom-select">
    <option value="" disabled selected hidden>-- Choose Bread --</option>
    <option value="white">White Bread</option>
    <option value="whole-wheat">Whole Wheat</option>
    <option value="sourdough">Sourdough</option>
    <option value="multigrain">Multigrain</option>
  </select>
  <span class="custom-arrow">▼</span>
</div>
   
<div class="dropdown-container">
  <select class="custom-select">
    <option value="" disabled selected hidden>-- Choose Meat / Protein --</option>
    <option value="chicken">Chicken</option>
    <option value="ham">Ham</option>
    <option value="bacon">Bacon</option>
    <option value="tuna">Tuna</option>
    <option value="egg">Egg</option>
  </select>
  <span class="custom-arrow">▼</span>
</div>


<div class="dropdown-container">
  <select class="custom-select">
    <option value="" disabled selected hidden>-- Choose Veggies --</option>
    <option value="lettuce">Lettuce</option>
    <option value="tomato">Tomato</option>
    <option value="onion">Onion</option>
    <option value="cucumber">Cucumber</option>
    <option value="bell-pepper">Bell Pepper</option>
  </select>
  <span class="custom-arrow">▼</span>
</div>

<div class="dropdown-container">
  <select class="custom-select">
    <option value="" disabled selected hidden>-- Choose Cheese & Sauce --</option>
    <option value="cheddar">Cheddar</option>
    <option value="mozzarella">Mozzarella</option>
    <option value="mayo">Mayo</option>
    <option value="mustard">Mustard</option>
    <option value="bbq">BBQ</option>
  </select>
  <span class="custom-arrow">▼</span>
</div>


<div class="dropdown-container">
  <select class="custom-select">
    <option value="" disabled selected hidden> Choose Extras </option>
    <option value="avocado">Avocado</option>
    <option value="pickles">Pickles</option>
    <option value="jalapeno">Jalapeño</option>
    <option value="extra-meat">Extra Meat</option>
    <option value="extra-cheese">Extra Cheese</option>
  </select>
  <span class="custom-arrow">▼</span>
</div>

  </div>

</body>
</html>
